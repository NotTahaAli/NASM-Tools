    <script nonce="${nonce}">
        const vscode = acquireVsCodeApi();

        // Memory configuration - dynamically extracted from DOM
        function getMemoryConfig() {
            const config = {};
            const sections = document.querySelectorAll('.memory-section');
            
            sections.forEach(section => {
                const sectionId = section.id;
                const segmentLabel = section.querySelector('.segment-label');
                const offsetLabel = section.querySelector('.offset-label');
                
                if (segmentLabel && offsetLabel) {
                    config[sectionId] = {
                        segment: segmentLabel.value.trim().toUpperCase(),
                        offset: offsetLabel.value.trim().toUpperCase()
                    };
                }
            });
            
            return config;
        }

        function updateMemorySection(sectionId, data, baseAddress) {
            if (!Array.isArray(data)) return;
            
            const section = document.getElementById(sectionId);
            const rows = section.querySelectorAll('.memory-row');
            const memoryConfig = getMemoryConfig();
            const config = memoryConfig[sectionId];
            
            if (!config) return;
            
            const baseOffset = parseInt(config.offset, 16);
            
            for (let rowIdx = 0; rowIdx < rows.length; rowIdx++) {
                const row = rows[rowIdx];
                const offsetAddr = (baseOffset + rowIdx * 16) & 0xFFFF;
                row.querySelector('.address').textContent = 
                    offsetAddr.toString(16).toUpperCase().padStart(4, '0') + ':';

                const inputs = row.querySelectorAll('.hex-input');
                let ascii = '';
                
                for (let byteIdx = 0; byteIdx < 16; byteIdx++) {
                    const dataIdx = rowIdx * 16 + byteIdx;
                    const byte = dataIdx < data.length ? data[dataIdx] : 0;
                    const hexValue = (byte & 0xFF).toString(16).toUpperCase().padStart(2, '0');
                    
                    inputs[byteIdx].value = hexValue;
                    // Store original value for change detection
                    originalValues.set(inputs[byteIdx], hexValue);
                    
                    if (sectionId === 'es-di-section') {
                        const char = byte >= 32 && byte <= 126 ? String.fromCharCode(byte) : '.';
                        ascii += char;
                    }
                }

                if (sectionId === 'es-di-section') {
                    const asciiDiv = row.querySelector('.ascii-display');
                    if (asciiDiv) {
                        asciiDiv.textContent = ascii;
                    }
                }
            }
        }

        // Handle messages from extension
        window.addEventListener('message', event => {
            const message = event.data;
            switch (message.type) {
                case 'setPausedState':
                    setPausedState(message.isPaused);
                    break;
                case 'updateMemorySection':
                    updateMemorySection(
                        message.sectionId,
                        message.memoryData,
                        message.baseAddress
                    );
                    break;
                case 'memoryModified':
                    // Handle confirmation of memory modification
                    handleMemoryModificationResult(message);
                    break;
            }
        });

        function setPausedState(isPaused) {
            console.log('Setting paused state:', isPaused);
            
            // Enable/disable all hex inputs
            document.querySelectorAll('.hex-input').forEach(input => {
                input.disabled = !isPaused;
            });

            if (isPaused) {
                requestMemoryData();
            }
        }

        function requestMemoryData() {
            // Get current memory configuration from DOM
            const memoryConfig = getMemoryConfig();
            
            // Request memory data for current addresses in each section
            Object.entries(memoryConfig).forEach(([sectionId, config]) => {
                console.log(`Requesting memory for ${sectionId}: ${config.segment}:${config.offset}`);
                vscode.postMessage({
                    type: 'examineMemory',
                    segment: config.segment,
                    offset: config.offset,
                    sectionId: sectionId
                });
            });
        }

        function updateMemoryAddress(sectionId, segment, offset) {
            // Update the header display
            const section = document.getElementById(sectionId);
            if (section) {
                const segmentLabel = section.querySelector('.segment-label');
                const offsetLabel = section.querySelector('.offset-label');
                if (segmentLabel) segmentLabel.value = segment.toUpperCase();
                if (offsetLabel) offsetLabel.value = offset.toUpperCase();
            }

            // If currently paused, immediately request new memory data
            const inputs = document.querySelectorAll('.hex-input');
            const isPaused = inputs.length > 0 && !inputs[0].disabled;
            if (isPaused) {
                vscode.postMessage({
                    type: 'examineMemory',
                    segment: segment,
                    offset: offset,
                    sectionId: sectionId
                });
            }
        }

        // Store original values to detect changes
        const originalValues = new Map();

        function getInputAddress(input) {
            const row = input.closest('.memory-row');
            const section = input.closest('.memory-section');
            const sectionId = section.id;
            const memoryConfig = getMemoryConfig();
            const config = memoryConfig[sectionId];
            
            if (!config || !row) return null;
            
            // Get row index and byte index within row
            const rows = section.querySelectorAll('.memory-row');
            const rowIndex = Array.from(rows).indexOf(row);
            const inputs = row.querySelectorAll('.hex-input');
            const byteIndex = Array.from(inputs).indexOf(input);
            
            // Calculate absolute address
            const segment = parseInt(config.segment, 16);
            const offset = parseInt(config.offset, 16);
            const linearAddress = (segment << 4) + offset + (rowIndex * 16) + byteIndex;
            
            return {
                segment: config.segment,
                linearAddress: linearAddress,
                segmentedAddress: `${config.segment}:${(offset + (rowIndex * 16) + byteIndex).toString(16).toUpperCase().padStart(4, '0')}`
            };
        }

        function modifyMemory(input) {
            const address = getInputAddress(input);
            if (!address) return;
            
            const newValue = input.value.padEnd(2, '0'); // Pad with zero if single digit
            const originalValue = originalValues.get(input) || '00';
            
            // Only send modification if value actually changed
            if (newValue !== originalValue) {
                console.log(`Modifying memory at ${address.segmentedAddress}: ${originalValue} -> ${newValue}`);
                
                // Add visual feedback - mark as pending
                input.classList.add('pending-modification');
                
                vscode.postMessage({
                    type: 'modifyMemory',
                    address: address.linearAddress,
                    segmentedAddress: address.segmentedAddress,
                    value: parseInt(newValue, 16),
                    hexValue: newValue
                });
                
                // Update stored original value
                originalValues.set(input, newValue);
            }
        }

        function handleMemoryModificationResult(message) {
            console.log('Memory modification result:', message);
            
            // Find the input element that was modified
            const inputs = document.querySelectorAll('.hex-input');
            for (const input of inputs) {
                const address = getInputAddress(input);
                if (address && address.linearAddress === message.address) {
                    // Remove pending state
                    input.classList.remove('pending-modification');
                    
                    if (message.success) {
                        // Show success feedback
                        input.classList.add('modification-success');
                        setTimeout(() => {
                            input.classList.remove('modification-success');
                        }, 1000);
                    } else {
                        // Show error feedback and revert value
                        input.classList.add('modification-error');
                        console.error('Memory modification failed:', message.error);
                        
                        // Optionally revert to original value on error
                        // input.value = originalValues.get(input) || '00';
                        
                        setTimeout(() => {
                            input.classList.remove('modification-error');
                        }, 2000);
                    }
                    break;
                }
            }
        }

        // Handle input validation and navigation
        document.addEventListener('input', e => {
            if (!e.target.classList.contains('hex-input')) return;
            let value = e.target.value.toUpperCase().replace(/[^0-9A-F]/g, '');
            if (value.length > 2) value = value.slice(0, 2);
            e.target.value = value;
        });

        // Handle memory modification on focus loss
        document.addEventListener('blur', e => {
            if (!e.target.classList.contains('hex-input')) return;
            modifyMemory(e.target);
        }, true); // Use capture phase to ensure we catch all blur events

        document.addEventListener('keydown', e => {
            if (!e.target.classList.contains('hex-input')) return;
            
            // Handle Enter key for memory modification
            if (e.key === 'Enter') {
                modifyMemory(e.target);
                e.target.blur(); // Remove focus after modification
                return;
            }
            
            // Navigation handling
            if (e.key === 'Backspace' && e.target.value === '') {
                const prev = e.target.previousElementSibling;
                if (prev && prev.classList.contains('hex-input')) {
                    prev.focus();
                    prev.select();
                }
            } else if (/^[0-9A-Fa-f]$/.test(e.key) && e.target.value.length === 1) {
                setTimeout(() => {
                    const next = e.target.nextElementSibling;
                    if (next && next.classList.contains('hex-input')) {
                        next.focus();
                        next.select();
                    }
                });
            }
        });

        // Store original values when inputs are focused
        document.addEventListener('focus', e => {
            if (!e.target.classList.contains('hex-input')) return;
            if (!originalValues.has(e.target)) {
                originalValues.set(e.target, e.target.value);
            }
        }, true);

        // Handle segment and offset input changes
        document.addEventListener('input', e => {
            if (e.target.classList.contains('segment-label') || e.target.classList.contains('offset-label')) {
                // Validate and format hex input
                let value = e.target.value.toUpperCase().replace(/[^0-9A-F]/g, '');
                if (value.length > 4) value = value.slice(0, 4);
                e.target.value = value;
            }
        });

        document.addEventListener('change', e => {
            if (e.target.classList.contains('segment-label') || e.target.classList.contains('offset-label')) {
                // Pad with zeros and trigger memory refresh
                e.target.value = e.target.value.padStart(4, '0');
                
                const section = e.target.closest('.memory-section');
                if (section) {
                    const sectionId = section.id;
                    const segmentInput = section.querySelector('.segment-label');
                    const offsetInput = section.querySelector('.offset-label');
                    
                    if (segmentInput && offsetInput) {
                        updateMemoryAddress(sectionId, segmentInput.value, offsetInput.value);
                    }
                }
            }
        });

        document.addEventListener('keydown', e => {
            if (e.target.classList.contains('segment-label') || e.target.classList.contains('offset-label')) {
                // Handle Enter key to trigger memory refresh
                if (e.key === 'Enter') {
                    e.target.blur(); // This will trigger the change event
                    return;
                }
            }
        });

        // Signal ready
        window.addEventListener('load', () => {
            vscode.postMessage({ type: 'webviewReady' });
        });
