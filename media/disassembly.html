    <script nonce="${nonce}">
        //@ts-check

        // This script will be run within the webview itself
        // It cannot access the main VS Code APIs directly.
        (function () {
            const vscode = acquireVsCodeApi();

            // Function to validate hex input and auto-capitalize
            window.validateHexInput = function(input) {
                // Remove any non-hex characters and convert to uppercase
                let value = input.value.replace(/[^0-9A-Fa-f]/g, '').toUpperCase();
                
                // Ensure it doesn't exceed maxlength
                if (input.maxLength && value.length > input.maxLength) {
                    value = value.substring(0, input.maxLength);
                }
                
                // Update the input value
                input.value = value;
                
                // Update ASCII representation
                updateAsciiForRow(input);
                
                // Notify extension of memory change
                handleMemoryChange(input);
            };

            function updateAsciiForRow(changedInput) {
                const memoryRow = changedInput.closest('.memory-row');
                const hexInputs = memoryRow.querySelectorAll('.hex-input');
                const asciiDisplay = memoryRow.querySelector('.ascii-display');
                
                let asciiString = '';
                hexInputs.forEach(input => {
                    const hexValue = input.value.padEnd(2, '0');
                    const byteValue = parseInt(hexValue, 16);
                    
                    if (byteValue >= 32 && byteValue <= 126) {
                        asciiString += String.fromCharCode(byteValue);
                    } else {
                        asciiString += '.';
                    }
                });
                
                asciiDisplay.textContent = asciiString;
            }

            function handleMemoryChange(input) {
                const memoryRow = input.closest('.memory-row');
                const address = memoryRow.querySelector('.address').textContent.replace(':', '');
                const hexInputs = memoryRow.querySelectorAll('.hex-input');
                const section = input.closest('.memory-section');
                const sectionIndex = Array.from(document.querySelectorAll('.memory-section')).indexOf(section);
                
                const bytes = Array.from(hexInputs).map(inp => inp.value.padEnd(2, '0'));
                
                console.log(`Memory changed at ${address}, section ${sectionIndex}:`, bytes);
                
                vscode.postMessage({
                    type: 'updateMemory',
                    address: address,
                    bytes: bytes,
                    sectionIndex: sectionIndex
                });
            }

            // Handle messages from extension
            window.addEventListener('message', event => {
                const message = event.data;
                switch (message.type) {
                    case 'updateMemorySection':
                        updateMemorySection(message.sectionIndex, message.memoryData, message.baseAddress);
                        break;
                }
            });

            function updateMemorySection(sectionIndex, memoryData, baseAddress) {
                const sections = document.querySelectorAll('.memory-section');
                const section = sections[sectionIndex];
                if (!section) return;
                
                const memoryRows = section.querySelectorAll('.memory-row');
                
                memoryData.forEach((rowData, rowIndex) => {
                    if (rowIndex < memoryRows.length) {
                        const row = memoryRows[rowIndex];
                        const hexInputs = row.querySelectorAll('.hex-input');
                        const asciiDisplay = row.querySelector('.ascii-display');
                        
                        // Update hex inputs
                        rowData.forEach((byte, byteIndex) => {
                            if (byteIndex < hexInputs.length) {
                                hexInputs[byteIndex].value = byte.toString(16).toUpperCase().padStart(2, '0');
                            }
                        });
                        
                        // Update ASCII display
                        const asciiString = rowData.map(byte => 
                            (byte >= 32 && byte <= 126) ? String.fromCharCode(byte) : '.'
                        ).join('');
                        asciiDisplay.textContent = asciiString;
                    }
                });
            }

            // Initialize ASCII displays
            document.querySelectorAll('.memory-row').forEach(row => {
                const firstInput = row.querySelector('.hex-input');
                if (firstInput) {
                    updateAsciiForRow(firstInput);
                }
            });
            
            // Signal that the webview is ready
            console.log('Memory disassembly webview loaded');
            vscode.postMessage({ type: 'webviewReady' });
        })();
    </script>
